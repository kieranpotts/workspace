#
# Repository manifest for run/install.py
#
# Each entry declares a bare clone plus one or more named worktrees.
# The worktree key becomes the directory name; the value is the branch.
#
# Example:
#   - name: kieranpotts/my-project
#     url: git@github.com:kieranpotts/my-project.git
#     worktrees:
#       default: main
#       v1: v1/dev
#
# This creates:
#   ~/dev/personal/kieranpotts/my-project/.bare      — bare clone
#   ~/dev/personal/kieranpotts/my-project/.git       — pointer file
#   ~/dev/personal/kieranpotts/my-project/default    — working tree at branch `main`
#   ~/dev/personal/kieranpotts/my-project/v1         — working tree at branch `v1/dev`
#

repos:
  - name: kieranpotts/__TODO__
    url: git@github.com:kieranpotts/__TODO__.git
    worktrees:
      default: main

  - name: kieranpotts/.github
